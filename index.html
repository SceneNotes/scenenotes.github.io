<!doctype html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f2ec">
  <meta name="description" content="Scene Notes — 風景、野生動物、日常のものたち。心に残った景色を静かに記録するフォトノート。">
  <title>Scene Notes | A photography notebook</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=2">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('scene-notes-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <script src="./app.js" defer></script>
</head>
<body>
  <!-- SVG icon library: local and independent from any CDN -->
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-mountain" viewBox="0 0 24 24"><path d="m2 20 7-12 4 7 3-5 6 10H2z"/><path d="m6.7 12 2.2 2 2.5-1.5"/></symbol>
    <symbol id="i-paw" viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="5.5" ry="4.3"/><ellipse cx="4.8" cy="9" rx="1.6" ry="2.2"/><ellipse cx="9.5" cy="6.5" rx="1.6" ry="2.2"/><ellipse cx="14.5" cy="6.5" rx="1.6" ry="2.2"/><ellipse cx="19.2" cy="9" rx="1.6" ry="2.2"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7l9-5zM3 7l9 5 9-5m-9 5v10"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 22v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M19.07 4.93l-1.42 1.42M6.35 17.65l-1.42 1.42"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.3 15.2A8.8 8.8 0 0 1 8.8 3.7 9 9 0 1 0 20.3 15.2Z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m11 5-7 7 7 7M4 12h16"/></symbol>
  </svg>

  <div class="site-shell" id="site-shell">
    <aside class="sidebar" id="sidebar" aria-label="サイドメニュー">
      <div class="sidebar-top">
        <a href="#/home" class="brand brand-desktop" aria-label="Scene Notes ホーム">
          <span>Scene<br>Notes</span>
        </a>
        <span class="brand-rule" aria-hidden="true"></span>
      </div>

      <nav class="side-navigation" aria-label="メインナビゲーション">
        <a class="nav-link" href="#/home" data-route="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span></a>
        <a class="nav-link" href="#/landscape" data-route="landscape"><svg class="icon" aria-hidden="true"><use href="#i-mountain"/></svg><span>Landscape</span></a>
        <a class="nav-link" href="#/wildlife" data-route="wildlife"><svg class="icon" aria-hidden="true"><use href="#i-paw"/></svg><span>Wildlife</span></a>
        <a class="nav-link" href="#/objects" data-route="objects"><svg class="icon" aria-hidden="true"><use href="#i-box"/></svg><span>Objects</span></a>
        <a class="nav-link" href="#/about" data-route="about"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg><span>About</span></a>
      </nav>

      <div class="sidebar-bottom">
        <button class="icon-button theme-button theme-button-desktop" type="button" data-theme-toggle aria-label="ダークモードに切り替える" title="ライト / ダーク切り替え">
          <svg class="icon sun-symbol" aria-hidden="true"><use href="#i-sun"/></svg>
          <svg class="icon moon-symbol" aria-hidden="true"><use href="#i-moon"/></svg>
        </button>
        <span class="sidebar-rule" aria-hidden="true"></span>
        <div class="sidebar-ornaments" aria-hidden="true"><span class="ornament-camera">◎</span><span class="ornament-dots">●●</span></div>
        <div class="sidebar-copyright">© <span data-year></span> Scene Notes</div>
      </div>
    </aside>

    <div class="mobile-backdrop" id="mobile-backdrop" hidden></div>

    <div class="main-column">
      <header class="site-header">
        <a class="brand brand-mobile" href="#/home">Scene Notes</a>
        <div class="header-actions">
          <button class="icon-button theme-button theme-button-mobile" type="button" data-theme-toggle aria-label="ダークモードに切り替える" title="ライト / ダーク切り替え">
            <svg class="icon sun-symbol" aria-hidden="true"><use href="#i-sun"/></svg>
            <svg class="icon moon-symbol" aria-hidden="true"><use href="#i-moon"/></svg>
          </button>
          <button class="icon-button menu-button" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="メニューを開く">
            <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
          </button>
        </div>
      </header>

      <main id="content" tabindex="-1">
        <section class="page page-home" id="page-home" aria-label="Scene Notes ホーム">
          <div class="hero-image-wrap">
            <img class="hero-image" src="./assets/hero.webp" alt="山並みと谷を照らす穏やかな日の出" fetchpriority="high" width="1620" height="550">
          </div>
          <div class="category-grid">
            <a class="category-card" href="#/landscape" aria-label="Landscape の写真を見る">
              <div class="card-heading"><span class="card-number">01</span><span class="card-tick" aria-hidden="true"></span><h2>Landscape</h2><span class="card-ja">風景</span></div>
              <img class="card-image" src="./assets/landscape.webp" alt="穏やかな山と湖の風景" width="970" height="526">
              <p class="card-description">旅先で出会った風景や、<br>日常の中にある美しい景色。</p>
              <span class="card-cta"><span>View More</span><span class="text-chevron" aria-hidden="true"></span></span>
            </a>
            <a class="category-card" href="#/wildlife" aria-label="Wildlife の写真を見る">
              <div class="card-heading"><span class="card-number">02</span><span class="card-tick" aria-hidden="true"></span><h2>Wildlife</h2><span class="card-ja">野生動物</span></div>
              <img class="card-image" src="./assets/wildlife.webp" alt="草原に佇むシカ" width="970" height="526">
              <p class="card-description">野生の動物たちが見せてくれる、<br>かけがえのない瞬間。</p>
              <span class="card-cta"><span>View More</span><span class="text-chevron" aria-hidden="true"></span></span>
            </a>
            <a class="category-card" href="#/objects" aria-label="Objects の写真を見る">
              <div class="card-heading"><span class="card-number">03</span><span class="card-tick" aria-hidden="true"></span><h2>Objects</h2><span class="card-ja">ものたち</span></div>
              <img class="card-image" src="./assets/objects.webp" alt="窓辺のフィルムカメラ" width="970" height="526">
              <p class="card-description">日常の中で出会う、<br>心に残るものたち。</p>
              <span class="card-cta"><span>View More</span><span class="text-chevron" aria-hidden="true"></span></span>
            </a>
          </div>
        </section>

        <section class="page page-inner" id="page-inner" aria-live="polite" hidden>
          <div id="inner-content"></div>
        </section>
      </main>
      <footer class="site-footer"><span>© <span data-year></span> Scene Notes</span></footer>
    </div>
  </div>

  <dialog class="photo-dialog" id="photo-dialog" aria-label="写真の拡大表示">
    <div class="dialog-content">
      <button class="dialog-close" type="button" id="dialog-close" aria-label="拡大表示を閉じる"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
      <button class="dialog-nav prev" type="button" id="photo-prev" aria-label="前の写真"><svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
      <img id="dialog-image" alt="">
      <button class="dialog-nav next" type="button" id="photo-next" aria-label="次の写真"><svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
      <div class="dialog-caption"><span id="dialog-title"></span><span id="dialog-counter"></span></div>
    </div>
  </dialog>
</body>
</html>
